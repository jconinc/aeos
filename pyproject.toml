[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aeos-kernel"
version = "0.5.0"
description = "Evidence- and authority-bound operating decision kernel"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "AEOS contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
memgraph = ["pymgclient>=1.5,<2"]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "pymgclient>=1.5,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aeos_kernel"]

[tool.hatch.build.targets.sdist]
include = ["src/aeos_kernel", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "compatibility: compares AEOS behavior with a pinned upstream source checkout",
  "integration: requires an explicitly configured external service",
]

[tool.coverage.run]
branch = true
source = ["aeos_kernel"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aeos_kernel"]

[[tool.mypy.overrides]]
module = ["mgclient"]
ignore_missing_imports = true
